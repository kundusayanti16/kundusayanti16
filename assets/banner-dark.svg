<radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 100) rotate(130) scale(360 400)"><stop stop-color="#D946EF" stop-opacity=".22"/><stop offset=".45" stop-color="#A855F7" stop-opacity=".1"/><stop offset="1" stop-color="#D946EF" stop-opacity="0"/></radialGradient>
